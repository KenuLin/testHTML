<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>足球員資訊查詢</title>
    <link rel="icon" type="image/png" href="images/rocket.png">
    <link rel="stylesheet" href="css/players.css">
    <script src="js/players.js" defer></script>
</head>
<body>

    <main class="wrap">
        <a href="index.html" class="back-link">← 返回首頁</a>
        <h1>⚽ 2026 世界盃球員查詢</h1>
        <p id="subtitle" class="subtitle">載入資料中...</p>

        <input
            id="search"
            type="text"
            class="search-box"
            placeholder="輸入球員姓名，例如 Messi、Mbappé..."
            autocomplete="off"
        >

        <p id="empty-state" class="empty-state" hidden>查無結果</p>

        <div id="league-preview" class="league-preview" hidden>
            <p class="league-preview-title">英超球隊</p>
            <div id="league-preview-list" class="chip-list"></div>
        </div>

        <ul id="results" class="results"></ul>

        <div id="detail-overlay" class="detail-overlay" hidden>
            <div class="detail-card">
                <button id="detail-close" class="detail-close" type="button" aria-label="關閉">✕</button>
                <div id="detail-content"></div>
            </div>
        </div>
    </main>

</body>
</html>
