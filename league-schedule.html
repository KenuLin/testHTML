<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>歐洲賽事賽程查詢</title>
    <link rel="icon" type="image/png" href="images/rocket.png">
    <link rel="stylesheet" href="css/players.css">
    <link rel="stylesheet" href="css/schedule.css">
    <link rel="stylesheet" href="css/league-schedule.css">
    <script src="js/league-schedule.js" defer></script>
</head>
<body>

    <main class="wrap wrap-wide">
        <a href="index.html" class="back-link">← 返回首頁</a>
        <h1>📅 歐洲賽事賽程查詢</h1>
        <p id="subtitle" class="subtitle">載入資料中...</p>

        <div class="league-team-row">
            <div class="field">
                <label class="team-select-label" for="league-select">選擇聯賽／賽事</label>
                <select id="league-select" class="team-select">
                    <option value="">— 請選擇聯賽／賽事 —</option>
                </select>
            </div>
            <div class="field">
                <label class="team-select-label" for="team-select">選擇球隊</label>
                <select id="team-select" class="team-select" disabled>
                    <option value="">— 全部球隊 —</option>
                </select>
            </div>
        </div>

        <div id="tv-banner" class="tv-banner" hidden></div>

        <label class="future-only-label">
            <input type="checkbox" id="future-only" checked>
            只顯示尚未開踢的場次
        </label>

        <p id="empty-state" class="empty-state" hidden>查無符合條件的賽事</p>

        <ul id="match-list" class="match-list"></ul>
    </main>

</body>
</html>
