<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人測試專案首頁</title>
    <link rel="icon" type="image/png" href="rocket.png">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: #ffffff;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            text-align: center;
            max-width: 420px;
            width: 90%;
        }

        h1 {
            font-size: 1.6rem;
            color: #333333;
            margin-bottom: 0.5rem;
        }

        p {
            color: #666666;
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .nav-btn {
            display: block;
            text-decoration: none;
            font-size: 1.15rem;
            font-weight: bold;
            padding: 1rem 1.5rem;
            border-radius: 8px;
            transition: all 0.2s ease-in-out;
            color: #ffffff;
        }

        /* 足球員查詢按鈕樣式 */
        .btn-football {
            background-color: #2e7d32;
        }
        .btn-football:hover {
            background-color: #1b5e20;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(46, 125, 50, 0.3);
        }

        /* App 測試頁按鈕樣式 */
        .btn-app-test {
            background-color: #1976d2;
        }
        .btn-app-test:hover {
            background-color: #115293;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(25, 118, 210, 0.3);
        }

        /* 賽程查詢按鈕樣式 */
        .btn-schedule {
            background-color: #ef6c00;
        }
        .btn-schedule:hover {
            background-color: #b34700;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(239, 108, 0, 0.3);
        }

        /* 聯賽賽程查詢按鈕樣式 */
        .btn-league-schedule {
            background-color: #1565c0;
        }
        .btn-league-schedule:hover {
            background-color: #0d47a1;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(21, 101, 192, 0.3);
        }
    </style>
</head>
<body>

    <main class="container">
        <h1>專案功能導航</h1>
        <p>請選擇欲前往的測試頁面或功能模組</p>

        <div class="button-group">
            <a href="players.html" class="nav-btn btn-football">
                ⚽ 足球員資訊查詢
            </a>

            <a href="schedule.html" class="nav-btn btn-schedule">
                📅 賽程與轉播時間查詢
            </a>

            <a href="league-schedule.html" class="nav-btn btn-league-schedule">
                🏆 五大聯賽賽程查詢
            </a>

            <a href="app-test.html" class="nav-btn btn-app-test">
                📱 App 跳轉與 JSBridge 測試
            </a>
        </div>
    </main>

</body>
</html>
